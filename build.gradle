// Gun Mod — a Minecraft Forge mod for Minecraft 26.2 (Forge 65.x).
//
// This build script follows the official Forge 26.2 MDK template (ForgeGradle 7, Java 25).
// All tunable values live in gradle.properties.
//
// For complex setups (AccessTransformers, Jar-in-Jar, Mixins) see:
//   https://github.com/MinecraftForge/MDKExamples

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

// Mojang ships Java 25 to end users in 26.1+, so the mod targets Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

println "Java: ${providers.systemProperty('java.version').get()}, " +
    "JVM: ${providers.systemProperty('java.vm.version').get()} (${providers.systemProperty('java.vendor').get()}), " +
    "Arch: ${providers.systemProperty('os.arch').get()}"

// Include resources produced by the data generators (runData).
sourceSets.main.resources { srcDir layout.projectDirectory.dir('src/generated/resources') }

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            // Forge 26.x uses EventBus 7, which validates listeners at compile time.
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', mod_id,
                 '--all',
                 '--output', layout.projectDirectory.dir('src/generated/resources'),
                 '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    // The Minecraft version must agree with the Forge version to produce a valid artifact.
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")

    // EventBus 7 can validate @SubscribeEvent listeners at compile time via this annotation
    // processor. This mod registers NO event-bus listeners (it uses DeferredRegister and the
    // creative-tab builder only), so the processor is optional here and is left off to avoid
    // pinning a version. If you add @SubscribeEvent handlers, uncomment the line below and set
    // eventbus_version in gradle.properties to the value from the official 26.2 MDK's build.gradle.
    // annotationProcessor "net.minecraftforge:eventbus-validator:${eventbus_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Surface the mod metadata into the jar manifest for runtime reads.
tasks.named('jar', Jar) {
    manifest {
        attributes([
            'Specification-Title'   : mod_id,
            'Specification-Vendor'  : mod_authors,
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : mod_authors
        ])
    }
}

idea.module { downloadJavadoc = downloadSources = true }
eclipse.classpath { downloadJavadoc = downloadSources = true }
