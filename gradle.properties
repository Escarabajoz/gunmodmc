# ---- Gradle behaviour ----
org.gradle.jvmargs=-Xmx3G
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# ForgeGradle 7 merges the main/client source sets.
net.minecraftforge.gradle.merge-source-sets=true

# ---- Environment versions (Minecraft 26.2 / Forge 65.x) ----
# The Minecraft version must agree with the Forge version to resolve a valid artifact.
minecraft_version=26.2
# Accept any 26.x at or above the target when this mod is loaded.
minecraft_version_range=[26.2,27)
# The Forge version, taken from the launcher profile (forge-65.0.3).
forge_version=65.0.3
# Only the major Forge/FML version bounds the loader range.
forge_version_range=[65,)
loader_version_range=[65,)

# EventBus validator (annotation processor). If Gradle cannot resolve this exact
# version, open the official 26.2 MDK's build.gradle and copy the value it uses.
eventbus_version=7.0.5

# ---- Mod metadata ----
# Must be lowercase and match the MODID constant in GunMod.java and the [[mods]] id in mods.toml.
mod_id=gunmod
mod_name=Gun Mod
mod_license=MIT
mod_version=1.0.0
# Matches the base Java package of the sources.
mod_group_id=com.gmail.doghash01.gunmod
mod_authors=doghash01
mod_description=Adds a family of hitscan firearms — pistol, SMG, assault rifle, shotgun and sniper — with dedicated ammo, bullet spread, headshots, knockback and muzzle effects.
