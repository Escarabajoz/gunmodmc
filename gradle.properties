# ---- Gradle behaviour ----
org.gradle.jvmargs=-Xmx3G
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# ForgeGradle 7 merges the main/client source sets.
net.minecraftforge.gradle.merge-source-sets=true

# ---- Versions referenced by build.gradle (Minecraft 26.2 / Forge 65.x) ----
# The Minecraft version must agree with the Forge version to resolve a valid artifact.
# Keep these two in sync with the version ranges declared in
# src/main/resources/META-INF/mods.toml, which is the source of truth for the ranges.
minecraft_version=26.2
# The Forge version, taken from the launcher profile (forge-65.0.3).
forge_version=65.0.3

# EventBus validator version. Only used if you re-enable the annotationProcessor line in
# build.gradle (this mod registers no event-bus listeners, so it is off by default). If you
# enable it and Gradle cannot resolve this version, copy the value from the official 26.2 MDK.
eventbus_version=7.0.5

# ---- Mod identity referenced by build.gradle (jar name, group id, manifest) ----
# mod_id must be lowercase and match the MODID constant in GunMod.java and the [[mods]] id in
# mods.toml. Display name, description, license and version ranges live in mods.toml.
mod_id=gunmod
mod_version=1.0.0
mod_group_id=com.gmail.doghash01.gunmod
mod_authors=doghash01
